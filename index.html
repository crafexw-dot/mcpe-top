<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCPE Top - SkyWars</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Minecraft&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mcgreen: '#3B5F2A',
                        mcstone: '#8B8B8B',
                        mcdiamond: '#5CDBDB',
                        mcgold: '#FFB900',
                        mciron: '#C0C0C0',
                    },
                    fontFamily: {
                        minecraft: ['Minecraft', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-image: url('https://textures.minecraft.net/texture/stone.png');
            background-size: 64px;
            image-rendering: pixelated;
            background-color: #1a1a1a;
        }
        .card-server {
            background-color: rgba(0,0,0,0.7);
            border: 3px solid #fff;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card-server:hover {
            transform: scale(1.05);
            border-color: #FFB900;
        }
    </style>
</head>
<body class="text-white font-minecraft">

    <!-- HEADER -->
    <header class="text-center py-8 bg-black/60 border-b-4 border-white">
        <h1 class="text-5xl md:text-7xl text-mcdiamond drop-shadow-[4px_4px_0_#000]">MCPE TOP</h1>
        <p class="text-2xl text-mcgold mt-2">SKYWARS RANKING</p>
    </header>

    <main class="container mx-auto p-4 mt-8">
        
        <!-- SEÇÃO DE CARDS -->
        <h2 class="text-3xl mb-6 text-center">🏰 Escolha o Servidor</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- CARD SERVIDOR EXEMPLO -->
            <div class="card-server rounded-lg p-4 cursor-pointer" onclick="openServer('ServerA')">
                <h3 class="text-2xl text-center text-mcgold">Servidor Exemplo</h3>
                <p class="text-center text-sm">play.exemplo.com</p>
                <div class="text-center mt-3">
                    <span class="bg-mcgreen px-2 py-1 rounded">TOP 1: Steve</span>
                </div>
            </div>

            <div class="card-server rounded-lg p-4 cursor-pointer" onclick="openServer('ServerB')">
                <h3 class="text-2xl text-center text-mcgold">PvP Brasil</h3>
                <p class="text-center text-sm">play.pvpbr.com</p>
                <div class="text-center mt-3">
                    <span class="bg-mcgreen px-2 py-1 rounded">TOP 1: Alex</span>
                </div>
            </div>

            <!-- Adicione mais cards aqui -->

        </div>

        <!-- ÁREA DO RANKING (aparece ao clicar) -->
        <div id="rankingArea" class="mt-12 hidden">
            <h2 id="serverTitle" class="text-4xl text-center mb-4"></h2>

            <!-- BOTÕES DE TEMPORADA -->
            <div class="flex justify-center gap-4 mb-8">
                <button class="season-btn bg-mcstone px-4 py-2 rounded border-2 border-white" data-year="2024">2024</button>
                <button class="season-btn bg-mcgold px-4 py-2 rounded border-2 border-white" data-year="2025">2025</button>
                <button class="season-btn bg-mcstone px-4 py-2 rounded border-2 border-white" data-year="2026">2026</button>
            </div>

            <!-- PODIO -->
            <div class="flex flex-col md:flex-row justify-center items-end gap-4">
                
                <!-- TOP 2 -->
                <div class="text-center order-2 md:order-1">
                    <img id="avatar2" src="https://minotar.net/helm/Steve/100" alt="Skin" class="w-24 h-24 mx-auto border-4 border-mciron rounded">
                    <p class="text-mciron text-xl">🥈 Top 2</p>
                    <p id="name2" class="text-lg"></p>
                </div>

                <!-- TOP 1 -->
                <div class="text-center order-1 md:order-2 scale-125 z-10">
                    <span class="text-4xl">💎</span>
                    <img id="avatar1" src="https://minotar.net/helm/Steve/100" alt="Skin" class="w-32 h-32 mx-auto border-4 border-mcdiamond rounded bg-black/50">
                    <p class="text-mcdiamond text-2xl">🥇 Top 1</p>
                    <p id="name1" class="text-xl font-bold"></p>
                </div>

                <!-- TOP 3 -->
                <div class="text-center order-3">
                    <img id="avatar3" src="https://minotar.net/helm/Steve/100" alt="Skin" class="w-24 h-24 mx-auto border-4 border-mcgold rounded">
                    <p class="text-mcgold text-xl">🥉 Top 3</p>
                    <p id="name3" class="text-lg"></p>
                </div>

            </div>

            <!-- DESCRIÇÃO -->
            <div class="mt-10 bg-black/70 p-6 rounded-lg border border-white max-w-2xl mx-auto">
                <h4 class="text-mcgold text-xl mb-2">ℹ️ Sobre o Servidor</h4>
                <p id="serverDesc" class="text-gray-300"></p>
            </div>

        </div>

    </main>

    <script>
        const data = {
            ServerA: {
                name: "Servidor Exemplo",
                desc: "O melhor servidor de SkyWars desde 2020! Sistema único de kits e eventos todos os finais de semana.",
                seasons: {
                    2024: { top1: "Steve", top2: "Alex", top3: "Herobrine" },
                    2025: { top1: "Notch", top2: "Steve", top3: "Alex" },
                    2026: { top1: "MasterBuilder", top2: "KingPvP", top3: "ProGamer" }
                }
            },
            ServerB: {
                name: "PvP Brasil",
                desc: "Focado em competitividade e ping baixo para jogadores brasileiros. Venha mostrar sua habilidade!",
                seasons: {
                    2024: { top1: "AlphaGamer", top2: "Bravo", top3: "Charlie" },
                    2025: { top1: "DeltaForce", top2: "EagleEye", top3: "Fireball" },
                    2026: { top1: "Zika", top2: "Yoda", top3: "XPro" }
                }
            }
        };

        function openServer(id) {
            const server = data[id];
            document.getElementById('serverTitle').innerText = server.name;
            document.getElementById('serverDesc').innerText = server.desc;
            document.getElementById('rankingArea').classList.remove('hidden');
            
            // Carrega temporada 2025 por padrão
            loadSeason(2025, server);
        }

        function loadSeason(year, server) {
            const s = server.seasons[year];
            document.getElementById('name1').innerText = s.top1;
            document.getElementById('name2').innerText = s.top2;
            document.getElementById('name3').innerText = s.top3;
            
            // Atualiza skins
            document.getElementById('avatar1').src = `https://minotar.net/helm/${s.top1}/100`;
            document.getElementById('avatar2').src = `https://minotar.net/helm/${s.top2}/100`;
            document.getElementById('avatar3').src = `https://minotar.net/helm/${s.top3}/100`;
        }

        // Lógica dos botões de ano
        document.querySelectorAll('.season-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const year = this.dataset.year;
                // Aqui você pegaria o servidor aberto no momento e recarregaria os dados
                alert(`Trocando para temporada de ${year}!`); 
                // Implemente a lógica completa aqui
            });
        });
    </script>

</body>
  </html>
