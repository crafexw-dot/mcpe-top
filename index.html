<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCPE TOP</title>

<style>
body {
    margin: 0;
    font-family: Arial;

    background-image: url("IMG_20260504_075723.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* clarear fundo */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.10);
    z-index: -1;
}

/* HEADER */
header {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 18px;
    background: rgba(0,0,0,0.4);
    border-bottom: 2px solid #00e5ff;
}

.logo {
    height: 120px;
}

/* BOTÃO */
.btn {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 60px;
    height: 60px;
    cursor: pointer;
}

.btn img {
    width: 100%;
}

.btn.hidden {
    display: none;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    top: 0;
    left: -300px;
    width: 260px;
    height: 100%;
    background: #111;
    transition: 0.3s;
    padding: 10px;
}

.sidebar.active {
    left: 0;
}

.server img {
    width: 100%;
    margin-bottom: 10px;
    border-radius: 8px;
    cursor: pointer;
}

/* 🔥 NOME DO SERVIDOR */
.server-title {
    font-size: 42px;
    color: #00e5ff;
    text-shadow: 0 0 15px #00e5ff;
    text-align: center;
    margin: 30px 0;
}

/* 🔥 CAIXA */
.rank-box {
    width: 90%;
    max-width: 700px;
    margin: auto;
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
    padding: 20px;
}

/* ITEM */
.rank-item {
    text-align: center;
    margin: 40px 0;
    color: white;
}

.rank-item img {
    width: 100%;
    max-width: 550px;
    border-radius: 10px;
}

/* TEXTO */
.rank-title {
    margin-top: 10px;
    font-size: 20px;
}

/* CABEÇA */
.player-head img {
    width: 60px;
    height: 60px;
    margin-top: 10px;
    border-radius: 6px;
}
</style>

</head>

<body>

<header>

    <div id="btn" class="btn" onclick="openMenu()">
        <img src="1777906131565.png">
    </div>

    <img src="IMG_20260504_080009.png" class="logo">

</header>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

    <div class="server" onclick="selectServer('WorldSky')">
        <img src="20260504_164003.png">
    </div>

    <div class="server" onclick="selectServer('EspaçoMC')">
        <img src="20260504_164131.png">
    </div>

</div>

<!-- CONTEUDO -->
<div>

    <!-- NOME DO SERVIDOR -->
    <div id="serverTitle" class="server-title">
        WorldSky
    </div>

    <!-- CAIXA DO RANK -->
    <div class="rank-box">

        <!-- TOP 1 -->
        <div class="rank-item">
            <img src="1777906224540.png">
            <div class="rank-title">Top 1 Player</div>
            <div class="player-head">
                <img src="https://mc-heads.net/avatar/Steve/100">
            </div>
        </div>

        <!-- TOP 2 -->
        <div class="rank-item">
            <img src="1777906148792.png">
            <div class="rank-title">Top 2 Player</div>
            <div class="player-head">
                <img src="https://mc-heads.net/avatar/Steve/100">
            </div>
        </div>

        <!-- TOP 3 -->
        <div class="rank-item">
            <img src="1777906097814.png">
            <div class="rank-title">Top 3 Player</div>
            <div class="player-head">
                <img src="https://mc-heads.net/avatar/Steve/100">
            </div>
        </div>

    </div>

</div>

<script>

function openMenu() {
    document.getElementById("sidebar").classList.add("active");
    document.getElementById("btn").classList.add("hidden");
}

function closeMenu() {
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("btn").classList.remove("hidden");
}

function selectServer(name) {
    document.getElementById("serverTitle").innerText = name;
    closeMenu();
}

</script>

</body>
              </html>
