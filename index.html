<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCPE TOP</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle, #111, #000);
    color: white;
}

/* TOPO */
header {
    text-align: center;
    padding: 25px;
    background: #000;
    border-bottom: 2px solid #00e5ff;
}

h1 {
    font-size: 42px;
    color: #00e5ff;
    text-shadow: 0 0 10px #00e5ff;
    animation: glow 2s infinite alternate;
}

h2 {
    font-size: 28px;
    color: #ffd700;
    animation: pulse 1.5s infinite;
}

/* ANIMAÇÕES */
@keyframes glow {
    from { text-shadow: 0 0 5px #00e5ff; }
    to { text-shadow: 0 0 20px #00e5ff; }
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* CONTAINER */
.container {
    text-align: center;
    padding: 20px;
}

/* RANKING */
.ranking {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 20px;
    margin-top: 30px;
}

/* TOP CARDS */
.card {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 10px;
    width: 120px;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.1);
}

.top1 {
    border: 2px solid gold;
    transform: scale(1.2);
}

.top2 {
    border: 2px solid silver;
}

.top3 {
    border: 2px solid #cd7f32;
}

/* INFO */
.info {
    margin-top: 25px;
    font-size: 16px;
    color: #aaa;
}
</style>

</head>

<body>

<header>
    <h1>MCPE TOP</h1>
    <h2>⚔ SKY WARS</h2>
</header>

<div class="container">

    <!-- RANKING -->
    <div class="ranking">

        <div class="card top2">
            🥈<br>
            Player 2
        </div>

        <div class="card top1">
            🥇<br>
            Player 1
        </div>

        <div class="card top3">
            🥉<br>
            Player 3
        </div>

    </div>

    <!-- DATA -->
    <div class="info">
        📅 2026 | Temporada 1
    </div>

    <!-- INFO DO SERVIDOR -->
    <div class="info">
        ⚔ Mega Sky | SkyWars competitivo e eventos semanais
    </div>

</div>

</body>
</html>
