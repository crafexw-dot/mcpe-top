<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCPE TOP</title>

<style>
body {
    margin: 0;
    font-family: Arial;

    /* FUNDO */
    background-image: url("1777891596113.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* ESCURECER FUNDO */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -1;
}

/* TOPO */
header {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 15px;
    border-bottom: 2px solid #00e5ff;
}

/* LOGO (MCPE TOP IMAGEM) */
.logo {
    height: 55px;
    display: block;
    margin: auto;
}

/* BOTÃO MENU */
.btn {
    position: absolute;
    left: 10px;
    width: 40px;
    height: 40px;
    background: #222;
    border: 2px solid #00e5ff;
    cursor: pointer;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: -250px;
    top: 0;
    width: 250px;
    height: 100%;
    background: #111;
    transition: 0.3s;
    padding: 10px;
    border-right: 2px solid #00e5ff;
}

.sidebar.active {
    left: 0;
}

.server {
    background: #222;
    margin: 10px 0;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.server:hover {
    background: #333;
}

/* CONTEUDO */
.content {
    text-align: center;
    padding: 20px;
    color: white;
}

.sky {
    font-size: 22px;
    color: gold;
    margin-top: 10px;
}

.box {
    background: rgba(0,0,0,0.5);
    margin: 10px;
    padding: 10px;
    border-radius: 8px;
}

.dates {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
}

.dateBox {
    background: rgba(0,0,0,0.6);
    padding: 10px;
    border: 1px solid #00e5ff;
}
</style>

</head>

<body>

<header>
    <div class="btn" onclick="toggleSidebar()"></div>

    <!-- LOGO MCPE TOP -->
    <img src="IMG_20260504_080009.png" class="logo">
</header>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

    <div class="server" onclick="selectServer('Mega Sky')">
        Mega Sky
    </div>

    <div class="server" onclick="selectServer('PvP Brasil')">
        PvP Brasil
    </div>

</div>

<!-- CONTEUDO -->
<div class="content">

    <div class="sky">⚔ SKY WARS</div>

    <div id="serverName">Selecione um servidor</div>

    <div class="box">🥇 Top 1 - Player 1</div>
    <div class="box">🥈 Top 2 - Player 2</div>
    <div class="box">🥉 Top 3 - Player 3</div>

    <div class="dates">
        <div class="dateBox">2025</div>
        <div class="dateBox">2024</div>
        <div class="dateBox">2023</div>
    </div>

    <div class="box">
        Informações do servidor aparecem aqui.
    </div>

</div>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
}

function selectServer(name) {
    document.getElementById("serverName").innerText = "Servidor: " + name;
    toggleSidebar();
}
</script>

</body>
</html>
