<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCPE TOP</title>

<style>
body {
    margin: 0;
    font-family: Arial;

    background-image: url("IMG_20260504_075723.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* FUNDO MAIS CLARO */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.10);
    z-index: -1;
}

/* HEADER */
header {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 18px;
    background: rgba(0,0,0,0.4);
    border-bottom: 2px solid #00e5ff;
}

/* LOGO */
.logo {
    height: 120px;
}

/* 🔥 BOTÃO NO TOPO MAIOR */
.btn {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 55px;
    height: 55px;
    cursor: pointer;
    z-index: 10;
}

.btn img {
    width: 100%;
    height: 100%;
}

/* 🔥 SIDEBAR (FECHADA 100%) */
.sidebar {
    position: fixed;
    top: 0;
    left: -100%; /* 👈 some COMPLETO da tela */
    width: 260px;
    height: 100%;
    background: #111;
    transition: 0.3s ease;
    padding: 10px;
    border-right: 2px solid #00e5ff;
}

/* ABERTA */
.sidebar.active {
    left: 0;
}

.server {
    background: #222;
    margin: 10px 0;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.server:hover {
    background: #333;
}

/* CONTEUDO */
.content {
    text-align: center;
    padding: 20px;
    color: white;
}

.sky {
    font-size: 22px;
    color: gold;
    margin-top: 10px;
}

.box {
    background: rgba(0,0,0,0.5);
    margin: 10px;
    padding: 10px;
    border-radius: 8px;
}

.dates {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
}

.dateBox {
    background: rgba(0,0,0,0.6);
    padding: 10px;
    border: 1px solid #00e5ff;
}

/* FUNDO ESCURO QUANDO ABRE MENU */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
}

.overlay.active {
    display: block;
}
</style>

</head>

<body>

<header>

    <!-- BOTÃO -->
    <div class="btn" onclick="toggleSidebar()">
        <img src="1777896131565.png">
    </div>

    <!-- LOGO -->
    <img src="IMG_20260504_080009.png" class="logo">

</header>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

    <div class="server" onclick="selectServer('Mega Sky')">
        Mega Sky
    </div>

    <div class="server" onclick="selectServer('PvP Brasil')">
        PvP Brasil
    </div>

</div>

<!-- CONTEUDO -->
<div class="content">

    <div class="sky">⚔ SKY WARS</div>

    <div id="serverName">Selecione um servidor</div>

    <div class="box">🥇 Top 1 - Player 1</div>
    <div class="box">🥈 Top 2 - Player 2</div>
    <div class="box">🥉 Top 3 - Player 3</div>

    <div class="dates">
        <div class="dateBox">2025</div>
        <div class="dateBox">2024</div>
        <div class="dateBox">2023</div>
    </div>

    <div class="box">
        Informações do servidor aparecem aqui.
    </div>

</div>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.add("active");
    document.getElementById("overlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

function selectServer(name) {
    document.getElementById("serverName").innerText = "Servidor: " + name;
    closeSidebar(); // fecha COMPLETO
}
</script>

</body>
</html>
